name: Build pull request

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - fix/appmenu-runtime-black
      - feat/amoled-web
      - feature/amoled-browser-theme-tablet-status-bar
  pull_request:
    branches:
      - dev

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Verify PatchManifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Patch discovery must not see stale compiled classes from Gradle cache
          # after a patch source is deleted or renamed.
          ./gradlew :patches:clean :patches:generatePatchManifest --no-daemon
          git diff --exit-code -- patch-manifest-v1.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs
