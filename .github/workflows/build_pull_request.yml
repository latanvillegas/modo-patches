name: Build pull request

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - fix/appmenu-runtime-black
      - feat/amoled-web
      - feature/amoled-browser-theme-tablet-status-bar
      # CI trigger marker: AMOLED Main selector audit 2026-10-03
  pull_request:
    branches:
      - dev

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Verify PatchManifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Patch discovery must not see stale compiled classes from Gradle cache
          # after a patch source is deleted or renamed.
          ./gradlew :patches:clean :patches:generatePatchesList --no-daemon
          python3 .github/scripts/generate_patch_manifest.py patches-list.json patch-manifest-metadata-v1.json patch-manifest-v1.json
          git diff --exit-code -- patch-manifest-v1.json

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Select runtime patch bundle
        id: runtime-bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' -print)
          if [ "${#bundles[@]}" -ne 1 ]; then
            printf 'Expected exactly one runtime .mpp bundle, found %s:\n' "${#bundles[@]}" >&2
            printf '  %s\n' "${bundles[@]}" >&2
            exit 1
          fi
          echo "path=${bundles[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ steps.runtime-bundle.outputs.path }}
