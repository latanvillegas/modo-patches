name: Validate Cromite patch 14

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cromite-amoled-brightness-controls
    paths:
      - '.github/workflows/validate-cromite-patch14.yml'
      - 'extensions/cromite/**'
      - 'patches/src/main/kotlin/app/morphe/patches/cromite/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'

permissions:
  contents: read
  packages: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            patches/build
            extensions/cromite/build
          key: cromite-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            cromite-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configure GitHub Maven credentials
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GITHUB_ACTOR"
          test -n "$GITHUB_TOKEN"
          echo "GITHUB_ACTOR=$GITHUB_ACTOR" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=$GITHUB_TOKEN" >> "$GITHUB_ENV"

      - name: Discover Cromite extension tasks
        run: |
          chmod +x ./gradlew
          ./gradlew :extensions:cromite:tasks --all --no-daemon > cromite-tasks.txt
          grep -Ei 'assemble|extension|bundle|dex' cromite-tasks.txt || true
          ./gradlew :patches:tasks --all --no-daemon > patches-tasks.txt
          grep -Ei 'android|dex|bundle|mpp|assemble' patches-tasks.txt || true

      - name: Build patch bundle and Cromite extension
        run: |
          ./gradlew :patches:assemble :extensions:cromite:assemble --build-cache --no-daemon --stacktrace

      - name: Verify packaged MPE and runtime classes
        shell: bash
        run: |
          set -euo pipefail
          find extensions/cromite patches/build -type f -name '*.mpe' -print
          mpe="$(find . -type f -name 'cromite.mpe' -print -quit)"
          if [[ -z "$mpe" ]]; then
            echo "::error::extensions/cromite.mpe was not produced"
            exit 1
          fi
          echo "MPE generated: $mpe"
          file "$mpe"
          # MPE is a DEX container; inspect the artifact rather than assuming
          # the Kotlin patch source is packaged into the Android runtime.
          if ! grep -a -q 'AmoledBrightnessController' "$mpe"; then
            echo "::error::Brightness controller missing from MPE"
            exit 1
          fi
          if ! grep -a -q 'AmoledPreferenceBridge' "$mpe"; then
            echo "::error::Preference bridge missing from MPE"
            exit 1
          fi

      - name: Package Android-compatible MPP with DEX
        shell: bash
        run: |
          set -euo pipefail
          source_mpp="$(find patches/build/libs -maxdepth 1 -name 'patches-*.mpp' ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' ! -name '*-android.mpp' -print -quit)"
          test -n "$source_mpp"
          test -f "$source_mpp"
          version="$(basename "$source_mpp" .mpp)"
          android_mpp="patches/build/libs/${version}-android.mpp"
          work="$(mktemp -d)"
          mkdir -p "$work/classes"
          (cd "$work/classes" && unzip -q "$GITHUB_WORKSPACE/$source_mpp" '*.class')
          (cd "$work/classes" && zip -qr "$work/patches-classes.jar" .)
          mkdir -p "$work/dex"
          d8="$ANDROID_HOME/build-tools/36.0.0/d8"
          test -x "$d8"
          "$d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output "$work/dex" "$work/patches-classes.jar"
          test -s "$work/dex/classes.dex"
          cp "$source_mpp" "$android_mpp"
          (cd "$work/dex" && zip -q -u "$GITHUB_WORKSPACE/$android_mpp" classes.dex)
          unzip -tq "$android_mpp"
          unzip -Z1 "$android_mpp" | grep -qx 'classes.dex'
          unzip -Z1 "$android_mpp" | grep -q 'CromiteAmoledBrightnessPatchKt.class'
          unzip -Z1 "$android_mpp" | grep -q 'extensions/cromite.mpe'
          echo "Android MPP generated: $android_mpp"
          ls -lh "$android_mpp"

      - name: Create Cromite-only lightweight MPP
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/make-cromite-lite-mpp.py patches/build/libs/patches-1.51.0-android.mpp patches/build/libs/cromite-amoled-lite.mpp
          unzip -tq patches/build/libs/cromite-amoled-lite.mpp
          ls -lh patches/build/libs/*android.mpp patches/build/libs/cromite-amoled-lite.mpp

      - name: Inspect Android manager bundle requirements
        shell: bash
        run: |
          set -euo pipefail
          bundle='patches/build/libs/patches-1.51.0-android.mpp'
          test -f "$bundle"
          echo 'Main bundle entries relevant to Android:'
          unzip -Z1 "$bundle" | grep -E '(^classes[0-9]*\.dex$|AmoledBrightnessPatch|cromite\.mpe)' || true
          if ! unzip -Z1 "$bundle" | grep -Eq '^classes[0-9]*\.dex$'; then
            echo '::warning::The compiled MPP has no classes.dex.'
          fi

      - name: Upload lightweight Cromite MPP
        uses: actions/upload-artifact@v4
        with:
          name: cromite-amoled-lite
          if-no-files-found: error
          path: patches/build/libs/cromite-amoled-lite.mpp
          compression-level: 0

      - name: Upload diagnostics and compiled outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cromite-patch14-build
          if-no-files-found: warn
          path: |
            cromite-tasks.txt
            patches-tasks.txt
          retention-days: 3
