name: Cromite AMOLED patch validation

on:
  push:
    branches:
      - fix/amoled-web-cromite-153
  pull_request:
    paths:
      - 'patches/src/main/kotlin/app/morphe/patches/cromite/layout/theme/PureAmoledWebPatch.kt'
      - '.github/workflows/cromite-amoled-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./gradlew :patches:build :patches:generatePatchesList --no-daemon --stacktrace
      - name: Inspect generated patch catalog
        if: success()
        run: |
          if [ ! -f patches-list.json ]; then
            echo 'patches-list.json was not generated' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('patches-list.json')
          data = json.loads(path.read_text())
          print('Catalog:', path, 'bytes:', path.stat().st_size)
          print('Top-level type:', type(data).__name__)
          if isinstance(data, dict):
              print('Top-level keys:', ', '.join(map(str, data.keys())))
              patches = data.get('patches')
              if isinstance(patches, (list, dict)):
                  print('Discovered patches:', len(patches))
          elif isinstance(data, list):
              print('Discovered entries:', len(data))
          PY
      - name: Create Android DEX bundle for comparison
        if: success()
        run: |
          set -euo pipefail
          ORIGINAL="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' | head -n 1)"
          test -n "$ORIGINAL"
          D8="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -mindepth 2 -maxdepth 2 -type f -name d8 | sort -V | tail -n 1)"
          test -n "$D8"
          echo "Using D8: $D8"
          mkdir -p patches/build/android-dex patches/build/android-bundle
          cp "$ORIGINAL" patches/build/android-bundle/patches-1.51.0-android.mpp
          cp "$ORIGINAL" patches/build/android-dex/input.jar
          "$D8" --min-api 26 --output patches/build/android-dex patches/build/android-dex/input.jar
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          dex = Path('patches/build/android-dex/classes.dex')
          bundle = Path('patches/build/android-bundle/patches-1.51.0-android.mpp')
          assert dex.is_file() and dex.stat().st_size > 0
          with ZipFile(bundle, 'a') as z:
              assert 'classes.dex' not in z.namelist(), 'Bundle already contains classes.dex'
              z.write(dex, 'classes.dex', compress_type=ZIP_DEFLATED)
          with ZipFile(bundle) as z:
              assert z.testzip() is None
              assert 'classes.dex' in z.namelist()
              print('Android bundle:', bundle, 'DEX bytes:', z.getinfo('classes.dex').file_size)
          PY
      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cromite-amoled-patch-build
          path: |
            patches/build/libs/**
            patches/build/outputs/**
            patches/build/android-bundle/**
            patches-list.json
          if-no-files-found: warn
