name: Validate Lawnchair AMOLED patch

on:
  push:
    branches:
      - feature/lawnchair-pure-amoled-beta3
    paths:
      - 'patches/src/main/kotlin/app/morphe/patches/lawnchair/**'
      - '.github/workflows/lawnchair_amoled_validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile patches (no APK patching or release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Morphe patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Verify compiled patch bundle
        shell: bash
        run: |
          set -euo pipefail
          find patches/build/libs -maxdepth 1 -type f -print
          if ! find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | grep -q .; then
            echo "::error::No .mpp bundle found in patches/build/libs"
            exit 1
          fi

      - name: Upload Morphe patch bundle
        uses: actions/upload-artifact@v7
        with:
          name: lawnchair-amoled-patches
          archive: false
          path: patches/build/libs/*.mpp
          if-no-files-found: error
